name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests, lint, format, and types
    runs-on: ubuntu-latest
    env:
      CUSP_SESSION_SECRET: ci-only-session-secret-1234567890
      CUSP_TOKEN_PEPPER: ci-only-token-pepper-1234567890
      CUSP_PRICING_CATALOG_PATH: ${{ github.workspace }}/docs/pricing.json
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install workspace dependencies
        run: uv sync --all-packages --dev
      - name: Run tests
        run: uv run pytest -q
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright type check
        run: uv run pyright
      - name: Dependency audit
        run: |
          uv export --no-emit-workspace --no-dev --format requirements-txt \
            --output-file /tmp/cusp-requirements.txt
          uv run pip-audit --strict -r /tmp/cusp-requirements.txt

  dashboard:
    name: Dashboard lint, types, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint dashboard
        run: pnpm lint
      - name: Type check dashboard
        run: pnpm exec tsc -b
      - name: Build dashboard
        run: pnpm build
      - name: Dashboard API client tests
        run: pnpm test
      - name: Audit dashboard dependencies
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Production Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUSP_SESSION_SECRET: ci-only-session-secret-1234567890
      CUSP_TOKEN_PEPPER: ci-only-token-pepper-1234567890
      CUSP_PRICING_CATALOG_PATH: /app/docs/pricing.json
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the production-shaped stack
        run: docker compose up --build -d
      - name: Wait for gateway health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health/liveness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent http://localhost:5173 >/dev/null
          docker compose ps
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
