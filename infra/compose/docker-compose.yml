name: cusp-dev

networks:
  cusp-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cusp
      POSTGRES_PASSWORD: cusp_dev_only
      POSTGRES_DB: cusp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cusp"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [cusp-net]

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [cusp-net]