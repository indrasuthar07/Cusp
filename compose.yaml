services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cusp
      POSTGRES_PASSWORD: cusp_dev_only
      POSTGRES_DB: cusp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cusp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - CUSP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://cusp:cusp_dev_only@postgres:5432/cusp
      - REDIS_URL=redis://redis:6379/0
      - CUSP_SESSION_SECRET=local-development-session-secret
      - CUSP_TOKEN_PEPPER=local-development-token-pepper
      - CUSP_PRICING_CATALOG_PATH=/app/docs/pricing.json
      - CUSP_HOSTED_EGRESS_ALLOWED=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      - CUSP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://cusp:cusp_dev_only@postgres:5432/cusp
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      CUSP_GATEWAY_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
