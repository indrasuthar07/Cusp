[project]
name = "cusp"
version = "0.1.0"
description = "Free-First, Provider-Neutral Governance Gateway"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
ml = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[tool.uv.workspace]
members = [
    "packages/cusp-sdk-python",
    "services/gateway",
    "services/worker"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates dependency factories as part of its supported route signature.
"services/gateway/app/api/*.py" = ["B008"]
"services/gateway/app/auth/dependencies.py" = ["B008"]

[tool.pyright]
include = [
    "packages/cusp-sdk-python/cusp",
    "services/gateway/app",
    "services/worker/app",
]
exclude = ["tests", "services/gateway/alembic"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingTypeStubs = "none"
reportArgumentType = "none"
reportAssignmentType = "none"
reportCallIssue = "none"
reportOptionalIterable = "none"
reportReturnType = "none"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "services/gateway",
    "packages/cusp-sdk-python",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
